<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Hanzi Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">



<style>
/* Layout: one phone-width column; a winding path of level stones; lessons and mini-games take the full card with a chunky action bar. Single bright look by choice (kids' game); the accent hue follows the child's chosen theme. */
:root{
  --bg:#E8F5EE; --paper:#FFFFFF; --ink:#1E2B3F; --muted:#5A6B7D; --line:#CFE2D8;
  --jade:#139C78; --jade-d:#0B795C; --jade-soft:#D2F0E3;
  --persimmon:#FF6B3D; --persimmon-d:#D24A1F; --persimmon-soft:#FFE2D6;
  --sun:#FFC83A; --sun-d:#DCA000; --sun-soft:#FFF3CC;
  --sky:#3D8BFF; --sky-d:#2766C7; --sky-soft:#E6F0FF;
  --lock:#CBD5DC; --lock-d:#A5B3BD;
  --f-display:"ZCOOL KuaiLe","Baloo 2",system-ui,sans-serif;
  --f-ui:"Baloo 2",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-han:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--sun-d);outline-offset:2px}
.han{font-family:var(--f-han)}
.nopy .py{display:none!important}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-block:12px 0}

.btn{border:0;border-radius:16px;padding:12px 20px;font-weight:800;font-size:17px;letter-spacing:.02em;
  background:var(--jade);color:#fff;box-shadow:0 4px 0 var(--jade-d);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--jade-d)}
.btn[disabled]{background:var(--lock);box-shadow:0 4px 0 var(--lock-d);color:#fff;cursor:not-allowed}
.btn.red{background:var(--persimmon);box-shadow:0 4px 0 var(--persimmon-d)}
.btn.sun{background:var(--sun);color:var(--ink);box-shadow:0 4px 0 var(--sun-d)}
.btn.ghost{background:var(--paper);color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.small{padding:7px 14px;font-size:15px;border-radius:12px}
.btn.wide{width:100%}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;background:var(--paper);
  border:2px solid var(--line);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}

.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.top .me{display:flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:3px 12px 3px 4px;font-weight:700}
.top .me .av{font-size:22px}
.top .sp{flex:1}
.tog{border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:3px 9px;font-weight:700;font-size:14px}
.tog.on{background:var(--jade-soft);border-color:var(--jade);color:var(--jade-d)}

.mascot{position:relative;width:var(--s);height:var(--s);flex:none}
.mascot svg{width:100%;height:100%;display:block}
.memoji{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--paper);border:3px solid var(--ink);font-size:calc(var(--s) * .58);line-height:1}
.hat{position:absolute;left:50%;top:calc(var(--s) * -.26);transform:translateX(-50%) rotate(-8deg);font-size:calc(var(--s) * .42);line-height:1;z-index:1}

.hero{display:flex;gap:14px;align-items:center;margin:22px 0 4px}
.bubble{position:relative;background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:10px 14px;min-width:0;flex:1}
.bubble:before{content:"";position:absolute;left:-9px;top:26px;width:14px;height:14px;background:var(--paper);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.bubble h1{font-family:var(--f-display);font-weight:400;font-size:26px;margin:0;line-height:1.1;text-wrap:balance}
.bubble p{margin:2px 0 0;color:var(--muted);font-size:15px}

.cards{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.card{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:12px 14px}
.card h3{margin:0 0 6px;font-size:16px;display:flex;align-items:center;gap:6px}
.task{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:2px dashed var(--line);font-weight:700}
.task:first-of-type{border-top:0}
.task .ck{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-size:15px}
.task.done .ck{background:var(--jade);border-color:var(--jade);color:#fff}
.task.done .txt{text-decoration:line-through;color:var(--muted)}
.task .txt{flex:1;min-width:0}
.task .rw{font-variant-numeric:tabular-nums;color:var(--jade-d)}
.bar{height:14px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--sun);border-radius:999px}

.path{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;padding:28px 0 110px}
.node-row{display:flex;flex-direction:column;align-items:center;transform:translateX(calc(var(--x) * 1px));position:relative}
.node{width:78px;height:72px;border-radius:50%;border:0;font-size:34px;display:grid;place-items:center;
  background:var(--jade);box-shadow:0 7px 0 var(--jade-d);transition:transform .1s}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 var(--jade-d)}
.node.done{background:var(--sun);box-shadow:0 7px 0 var(--sun-d)}
.node.locked{background:var(--lock);box-shadow:0 7px 0 var(--lock-d);opacity:.9;cursor:not-allowed}
.node.key{background:var(--lock);box-shadow:0 7px 0 var(--lock-d)}
.node.mine{background:var(--sky);box-shadow:0 7px 0 var(--sky-d)}
.node.cur{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.node-lab{margin-top:10px;text-align:center;line-height:1.15}
.node-lab b{font-family:var(--f-display);font-weight:400;font-size:20px;display:block}
.node-lab span{font-size:13px;color:var(--muted);font-weight:700}
.free{display:inline-block;background:var(--sun-soft);color:#7A5600;border-radius:999px;padding:0 8px;font-size:11px;font-weight:800;letter-spacing:.06em;margin-top:2px}
.stars{color:var(--sun-d);letter-spacing:2px;font-size:15px}
.stars i{font-style:normal;color:var(--lock)}
.go{position:absolute;top:-38px;background:var(--paper);border:2px solid var(--line);color:var(--jade-d);font-weight:800;
  padding:2px 12px;border-radius:12px;font-size:14px;white-space:nowrap}
.go:after{content:"";position:absolute;left:50%;bottom:-7px;width:10px;height:10px;margin-left:-5px;background:var(--paper);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.unit-gap{width:4px;height:18px;border-radius:2px;background:var(--line)}

.nav{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:2px solid var(--line);display:flex;justify-content:center;
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:5}
.nav div{display:flex;gap:4px;max-width:560px;width:100%}
.nav button{flex:1;min-width:0;border:2px solid transparent;background:none;border-radius:14px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;font-weight:700;font-size:12px;color:var(--muted);line-height:1.15}
.nav button span{font-size:22px}
.nav button.on{border-color:var(--jade);background:var(--jade-soft);color:var(--jade-d)}
.badge{background:var(--persimmon);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;margin-left:2px}

.lesson{display:flex;flex-direction:column;min-height:100%;flex:1}
.lbar{display:flex;align-items:center;gap:12px}
.x{border:0;background:none;font-size:24px;color:var(--muted);padding:4px 6px}
.prog{flex:1;height:16px;background:var(--line);border-radius:999px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--jade);border-radius:999px;transition:width .3s;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.hearts{font-weight:800;color:var(--persimmon);font-variant-numeric:tabular-nums}
.qbody{flex:1;padding:22px 0 24px;display:flex;flex-direction:column;gap:16px}
.qtitle{font-weight:800;font-size:22px;margin:0;text-wrap:balance}
.qtitle small{display:block;font-family:var(--f-display);font-weight:400;font-size:16px;color:var(--muted)}
.prompt{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.say{border:0;width:56px;height:56px;border-radius:16px;background:var(--sky);box-shadow:0 4px 0 var(--sky-d);color:#fff;font-size:26px;flex:none}
.say.big{width:96px;height:96px;font-size:44px;border-radius:24px;margin:10px auto}
.say:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sky-d)}
.bighan{font-family:var(--f-han);font-weight:700;font-size:46px;line-height:1}
.py{color:var(--muted);font-weight:700;font-size:17px}
.bigpic{font-size:88px;line-height:1;text-align:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opts.three{grid-template-columns:1fr 1fr 1fr}
.opt{border:2px solid var(--line);background:var(--paper);border-radius:18px;padding:14px 8px;box-shadow:0 4px 0 var(--line);
  display:flex;flex-direction:column;align-items:center;gap:4px;min-height:84px;justify-content:center;min-width:0}
.opt .pic{font-size:46px;line-height:1.1}
.opt .h{font-family:var(--f-han);font-size:26px;font-weight:700}
.opt.sel{border-color:var(--sky);background:var(--sky-soft);box-shadow:0 4px 0 #9EC2FF}
.opt.ok{border-color:var(--jade);background:var(--jade-soft);box-shadow:0 4px 0 var(--jade)}
.opt.bad{border-color:var(--persimmon);background:var(--persimmon-soft);box-shadow:0 4px 0 var(--persimmon);animation:shake .3s}
.opt.gone{opacity:.35;pointer-events:none}
.opts.one{grid-template-columns:1fr}
.opts.one .opt{flex-direction:row;min-height:60px;gap:12px}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.match .col{display:flex;flex-direction:column;gap:12px}
.learn{background:var(--paper);border:2px solid var(--line);border-radius:24px;padding:22px 16px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.learn .tag{background:var(--sun-soft);color:#7A5600;font-weight:800;border-radius:999px;padding:2px 12px;font-size:14px}
.learn .bighan{font-size:64px;margin-top:6px}
.learn .mean{font-size:20px;font-weight:700}
.learn .pinyinbig{font-size:24px;color:var(--jade-d);font-weight:700}
.answer{min-height:64px;border-bottom:2px solid var(--line);border-top:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:10px 0;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding-top:6px}
.tile{border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:6px 14px;box-shadow:0 3px 0 var(--line);font-family:var(--f-han);font-size:24px;font-weight:700}
.tile.used{visibility:hidden}
.tile.blank{border-style:dashed;color:var(--muted);box-shadow:none;background:var(--sun-soft)}
.sent{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:12px 14px;display:flex;gap:12px;align-items:center}
.sent .pic{font-size:48px}
.tfq{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.tfq .q{display:flex;align-items:center;gap:12px;background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:10px 16px}
.foot{position:sticky;bottom:0;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:14px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  border-top:2px solid var(--line);background:var(--bg)}
.foot.good{background:var(--jade-soft);border-color:var(--jade-soft)}
.foot.bad{background:var(--persimmon-soft);border-color:var(--persimmon-soft)}
.fb{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.fb .ic{font-size:30px;line-height:1}
.fb h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:24px}
.foot.good h3{color:var(--jade-d)} .foot.bad h3{color:var(--persimmon-d)}
.fb p{margin:2px 0 0;font-weight:700}
.fb .han{font-size:20px}

.result{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:40px 0 30px}
.result h2{font-family:var(--f-display);font-weight:400;font-size:40px;margin:0;color:var(--jade-d)}
.result .big-stars{font-size:52px;letter-spacing:6px;color:var(--sun)}
.result .big-stars i{font-style:normal;color:var(--lock)}
.statrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.stat{border:2px solid var(--line);border-radius:16px;padding:8px 16px;background:var(--paper);min-width:96px}
.stat b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted);font-weight:700}
.gains{width:100%;max-width:340px;text-align:left}
.gains div{display:flex;justify-content:space-between;padding:4px 0;font-weight:700;border-bottom:2px dashed var(--line);font-variant-numeric:tabular-nums}

.section-h{font-family:var(--f-display);font-weight:400;font-size:24px;margin:22px 0 8px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.section-h span{font-family:var(--f-ui);font-size:14px;color:var(--muted);font-weight:700}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.wcard{border:2px solid var(--line);background:var(--paper);border-radius:16px;padding:10px;display:flex;gap:10px;align-items:center;text-align:left;box-shadow:0 3px 0 var(--line);min-width:0}
.wcard .pic{font-size:30px;flex:none}
.wcard .h{font-family:var(--f-han);font-weight:700;font-size:20px;display:block}
.wcard small{display:block;color:var(--muted);font-weight:600;font-size:13px;line-height:1.2}
.wcard .cnt{margin-left:auto;background:var(--persimmon-soft);color:var(--persimmon-d);border-radius:999px;padding:0 8px;font-weight:800;font-size:13px;flex:none}
.locked-note{color:var(--muted);font-weight:600}
.panel{background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel h3{margin:0;font-size:18px;display:flex;align-items:center;gap:8px}
.panel p{margin:0}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 6px;border-bottom:2px solid var(--line);white-space:nowrap}
th{font-size:13px;color:var(--muted)}
.mini{border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:2px 10px;font-weight:700;font-size:13px}
.mini.confirm{border-color:var(--persimmon);color:var(--persimmon-d)}
.start{flex:1;display:flex;flex-direction:column;gap:16px;padding:24px 0 40px}
.start .logo{text-align:center;display:flex;flex-direction:column;align-items:center}
.start .logo h1{font-family:var(--f-display);font-weight:400;font-size:46px;margin:10px 0 0;color:var(--jade-d);line-height:1}
.start .logo p{margin:4px 0 0;color:var(--muted);font-weight:700}
.players{display:flex;flex-wrap:wrap;gap:10px}
.pbtn{border:2px solid var(--line);background:var(--paper);border-radius:16px;padding:8px 14px;font-weight:800;display:flex;gap:8px;align-items:center;box-shadow:0 3px 0 var(--line)}
.pbtn span{font-size:26px}
.field{display:flex;flex-direction:column;gap:6px;font-weight:700;min-width:0}
.field input,.field select,.field textarea{border:2px solid var(--line);border-radius:14px;padding:10px 12px;font:inherit;font-size:17px;background:var(--paper);color:var(--ink);width:100%}
.field textarea{font-size:14px;min-height:110px;resize:vertical;font-family:ui-monospace,Menlo,monospace}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.avs{display:flex;flex-wrap:wrap;gap:8px}
.avs button{font-size:28px;width:54px;height:54px;border-radius:16px;border:2px solid var(--line);background:var(--paper)}
.avs button.on{border-color:var(--jade);background:var(--jade-soft)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:6px 12px;font-weight:700;font-size:14px}
.seg button.on{border-color:var(--jade);background:var(--jade-soft);color:var(--jade-d)}
.swatch{width:40px;height:40px;border-radius:12px;border:3px solid var(--paper);box-shadow:0 0 0 2px var(--line)}
.swatch.on{box-shadow:0 0 0 3px var(--ink)}
.hint{font-size:13px;color:var(--muted);font-weight:600}
.msg{border-radius:12px;padding:8px 12px;font-weight:700}
.msg.ok{background:var(--jade-soft);color:var(--jade-d)}
.msg.err{background:var(--persimmon-soft);color:var(--persimmon-d)}
.subtabs{display:flex;gap:8px;margin:18px 0 4px}
.subtabs button{flex:1;border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:8px;font-weight:800}
.subtabs button.on{border-color:var(--jade);background:var(--jade-soft);color:var(--jade-d)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--bg);border-radius:14px;padding:8px 10px}
.kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:12px;color:var(--muted);font-weight:700}

/* arcade */
.games{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.game{border:2px solid var(--line);background:var(--paper);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;box-shadow:0 4px 0 var(--line);text-align:left;min-width:0}
.game .gi{font-size:40px;line-height:1}
.game b{font-size:17px}
.game small{color:var(--muted);font-weight:600;line-height:1.25}
.game .cost{margin-top:auto;font-weight:800;color:var(--jade-d)}
.game[disabled]{opacity:.6;cursor:not-allowed}
.album{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stk{aspect-ratio:3/4;max-width:100%;border:2px solid var(--line);background:var(--paper);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px;min-width:0}
.stk .e{font-size:32px;line-height:1}
.stk .h{font-family:var(--f-han);font-weight:700;font-size:16px}
.stk small{font-size:11px;color:var(--muted);font-weight:700}
.stk.no .e{filter:grayscale(1) brightness(.2);opacity:.25}
.stk.no{border-style:dashed;background:transparent}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mc{aspect-ratio:1;max-width:100%;border:0;border-radius:16px;background:var(--jade);box-shadow:0 4px 0 var(--jade-d);display:grid;place-items:center;color:#fff;font-size:30px}
.mc.open{background:var(--paper);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.mc.got{background:var(--jade-soft);color:var(--jade-d);border:2px solid var(--jade);box-shadow:none}
.mc .h{font-family:var(--f-han);font-weight:700;font-size:28px}
.mc .p{font-size:40px}
.sky{position:relative;height:340px;background:linear-gradient(var(--sky-soft),var(--paper));border-radius:24px;border:2px solid var(--line);overflow:hidden}
.balloon{position:absolute;bottom:20px;width:84px;height:100px;border:0;background:none;padding:0;animation:float 3.2s ease-in-out infinite}
.balloon .b{display:grid;place-items:center;width:84px;height:96px;border-radius:50% 50% 46% 46%;font-size:38px;box-shadow:inset -8px -10px 0 rgba(0,0,0,.12)}
.balloon:after{content:"";position:absolute;left:50%;top:94px;width:2px;height:60px;background:var(--muted)}
.balloon.pop{animation:pop .35s forwards}
.balloon.bad .b{animation:shake .3s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-70px)}}
@keyframes pop{to{transform:scale(1.6);opacity:0}}
.hats{display:flex;flex-wrap:wrap;gap:10px}
.hatbtn{border:2px solid var(--line);background:var(--paper);border-radius:16px;padding:8px 12px;display:flex;flex-direction:column;align-items:center;font-weight:700;min-width:76px}
.hatbtn .e{font-size:30px}
.hatbtn.on{border-color:var(--jade);background:var(--jade-soft)}

.modal{position:fixed;inset:0;background:rgba(30,43,63,.45);display:grid;place-items:center;z-index:20;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))}
.modal .box{background:var(--paper);border-radius:24px;padding:22px;max-width:400px;width:100%;display:flex;flex-direction:column;gap:12px;text-align:center;align-items:center}
.modal h3{font-family:var(--f-display);font-weight:400;font-size:26px;margin:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){.bighan{font-size:40px}.bigpic{font-size:72px}.opt .pic{font-size:40px}.node-row{transform:translateX(calc(var(--x) * .7px))}.kpis{grid-template-columns:1fr 1fr}.album{grid-template-columns:repeat(3,1fr)}}

function fnv(s){let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return h>>>0}
const B32='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function chk(body){let h=fnv(body+CFG.salt),o='';for(let i=0;i<4;i++){o+=B32[h&31];h>>>=5}return o}
const normCode=c=>String(c).toUpperCase().replace(/[^A-Z0-9]/g,'');
function validCode(c){c=normCode(c);return /^HQ[A-Z0-9]{8}$/.test(c)&&chk(c.slice(2,6))===c.slice(6)}
let voices=[];

const AUD=typeof Audio!=='undefined'?new Audio():null;
function speakTTS(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.75;
 const v=voices.find(v=>/zh[-_]CN/i.test(v.lang))||voices.find(v=>/^zh/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
function say(t){const src=window.HQ_AUDIO&&HQ_AUDIO[t];if(!src||!AUD)return speakTTS(t);
 try{AUD.pause();AUD.src=src;AUD.currentTime=0;const pr=AUD.play();if(pr&&pr.catch)pr.catch(()=>speakTTS(t))}catch(e){speakTTS(t)}}
let AC;
function beep(ok){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime;
 (ok?[660,990]:[300,210]).forEach((f,j)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ok?'triangle':'square';o.frequency.value=f;
 const s=t+j*.12;g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(ok?.2:.06,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+.2);
 o.connect(g).connect(AC.destination);o.start(s);o.stop(s+.22)})}catch(e){}}

 const cards=ents.map(e=>{const it=findItem(e.k);if(!it)return'';const o=it.w||it.s;
  return `<button class="wcard" data-act="say" data-t="${esc(o.zh)}"><span class="pic">${o.pic}</span><span style="min-width:0"><span class="h">${o.zh}</span><small class="py">${o.py}</small><small>${esc(M(o))}</small></span><span class="cnt">×${e.n}</span></button>`}).join('');
 return `<div style="padding-bottom:110px">${head}
  <p class="hint" style="margin:0 0 12px">${D('Richtig beantwortet = raus aus dem Heft. Jede Korrektur bringt 2 🎋.','Answer correctly = out of the book. Each fix earns 2 🎋.')}</p>

/* ======================= lesson engine ======================= */
function newL(o){return Object.assign({i:0,hearts:5,mist:0,right:0,asked:0,done:new Set(),sel:null,phase:'ans',ans:[],fb:null,t0:Date.now(),total:o.q.filter(x=>!x.t.startsWith('learn')).length||1},o)}
function buildQueue(ui,first){
 const u=U[ui],cap=(FOCUS[P().custom.focus]||FOCUS.mid).n,q=[];let protect=0;
 const isQ=x=>!x.t.startsWith('learn');
 if(u.sentences){
  shuffle(u.sentences).forEach(s=>{if(first)q.push(mk({t:'learnS',s}));q.push(mk({t:'build',s}))});
  protect=first?q.length:Math.min(q.length,3);
  shuffle(u.sentences).slice(0,2).forEach(s=>q.push(mk({t:'gap',s})));
  shuffle(u.sentences).slice(0,2).forEach(s=>q.push(mk({t:'spic',s})));
  shuffle(u.sentences).slice(0,2).forEach(s=>q.push(mk({t:'slisten',s})));
 }else{
  const W=shuffle(u.words),ty=['pic','word','listen','tf'];
  for(let i=0;i<W.length;i+=2){const ch=W.slice(i,i+2);if(first)ch.forEach(w=>q.push(mk({t:'learn',w})));ch.forEach(w=>q.push(mk({t:first?'pic':pick(ty),w})))}
  q.push(mk({t:'match',ws:shuffle(W).slice(0,4)}));protect=first?q.length:Math.min(q.length,3);
  shuffle(W.filter(w=>[...w.zh].length===1&&toneVariants(w.py))).slice(0,2).forEach(w=>q.push(mk({t:'tone',w})));
  shuffle(W).slice(0,4).forEach((w,i)=>q.push(mk({t:ty[(i+1)%4],w})));
 }
 let n=q.filter(isQ).length;
 for(let k=q.length-1;k>=protect&&n>cap;k--){if(isQ(q[k])&&q[k].t!=='match'){q.splice(k,1);n--}}
 while(n<cap){if(u.sentences)q.push(mk({t:pick(['gap','spic','slisten','build']),s:pick(u.sentences)}));else q.push(mk({t:pick(['pic','word','listen','tf']),w:pick(u.words)}));n++}
 return q}
function buildReview(){const p=P();const q=[];
 Object.values(p.wrong).sort((a,b)=>b.n-a.n).slice(0,10).forEach(e=>{const it=findItem(e.k);if(!it)return;
  q.push(it.s?mk({t:pick(['build','slisten','gap']),s:it.s}):mk({t:pick(['pic','word','listen']),w:it.w}))});
 return shuffle(q)}
function startLesson(ui){const p=P(),u=U[ui];const first=!(p.units[u.id]||{}).seen;
 L=newL({mode:'unit',ui,q:buildQueue(ui,first)});view='lesson';render();autoSay()}
function startReview(){const q=buildReview();if(!q.length)return;L=newL({mode:'review',q});view='lesson';render();autoSay()}
const item=()=>L.q[L.i];
function prepare(it){
 if(it.ready)return;it.ready=true;
 if(it.t==='pic'){it.opts=shuffle([it.w,...distract(it.w,3,'pic')]).map(x=>({ok:x===it.w,x}))}
 if(it.t==='word'||it.t==='listen'){it.opts=shuffle([it.w,...distract(it.w,3,'zh')]).map(x=>({ok:x===it.w,x}))}
 if(it.t==='tf'){const d=distract(it.w,1,'zh')[0];const same=!d||Math.random()<.5;it.shown=same?it.w:d;
  it.opts=[{ok:same,lab:'✔ 对',sub:D('Stimmt','True')},{ok:!same,lab:'✘ 不对',sub:D('Stimmt nicht','False')}]}
 if(it.t==='tone'){const tv=toneVariants(it.w.py);it.opts=tv.list.map((p,n)=>({ok:n===tv.k,p,n}))}
 if(it.t==='spic'||it.t==='slisten'){it.opts=shuffle([it.s,...shuffle(SENT.filter(s=>s!==it.s)).slice(0,it.t==='spic'?3:2)]).map(x=>({ok:x===it.s,x}))}
 if(it.t==='gap'){it.blank=Math.random()*it.s.tiles.length|0;const right=it.s.tiles[it.blank];
  const others=shuffle([...new Set(SENT.filter(s=>s!==it.s).flatMap(s=>s.tiles))].filter(t=>!it.s.tiles.includes(t))).slice(0,2);
  it.opts=shuffle([right,...others]).map(t=>({ok:t===right,tile:t}))}
 if(it.t==='build'){const extra=shuffle(SENT.filter(s=>s!==it.s).flatMap(s=>s.tiles).filter(t=>!it.s.tiles.includes(t)));
  it.bank=shuffle(it.s.tiles.concat([...new Set(extra)].slice(0,2)))}
 if(it.t==='match'){it.left=shuffle(it.ws);it.right=shuffle(it.ws);it.m=new Set();it.sl=null;it.sr=null;it.bad=null}
}
function autoSay(){const it=item();if(!it)return;prepare(it);
 if(['learn','pic','listen','tone'].includes(it.t))say(it.w.zh);
 if(it.t==='tf')say(it.shown.zh);
 if(['learnS','slisten'].includes(it.t))say(it.s.zh)}

   <div class="opts">${it.opts.map((o,i)=>opt(o,i,`<span class="pic">${o.x.pic}</span>`)).join('')}</div>`;
 case 'word':return tt('Wie heißt das auf Chinesisch?','What is this in Chinese?','这是什么？')+`<div class="bigpic">${it.w.pic}</div>

 case 'listen':return tt('Hör zu und wähle!','Listen and choose!','听一听')+`<div style="text-align:center">${sp(it.w.zh,1)}</div>
   <div class="opts">${it.opts.map((o,i)=>opt(o,i,`<span class="h">${esc(o.x.zh)}</span>${L.phase==='fb'?`<span class="py">${esc(o.x.py)}</span>`:''}`)).join('')}</div>`;
 case 'tf':return tt('Stimmt das?','Is that right?','对不对？')+`<div class="tfq"><div class="bigpic">${it.w.pic}</div><div class="q">${sp(it.shown.zh)}<div style="text-align:left"><div class="bighan" style="font-size:36px">${esc(it.shown.zh)}</div><div class="py">${esc(it.shown.py)}</div></div></div></div>
   <div class="opts">${it.opts.map((o,i)=>opt(o,i,`<span class="h">${o.lab}</span><span class="hint">${o.sub}</span>`)).join('')}</div>`;
 case 'tone':return tt('Welcher Ton ist richtig?','Which tone is right?','几声？')+`<div class="prompt">${sp(it.w.zh)}<span class="bighan">${esc(it.w.zh)}</span><span style="font-size:48px">${it.w.pic}</span></div>
   <div class="opts">${it.opts.map((o,i)=>opt(o,i,`<span class="h" style="font-family:var(--f-ui)">${esc(o.p)}</span><span class="hint">${o.n+1}. 声</span>`)).join('')}</div>`;
 case 'match':return tt('Finde die Paare!','Match the pairs!','连一连')+`<div class="match"><div class="col">${it.left.map((w,i)=>`<button class="opt ${it.m.has(w.zh)?'ok gone':''} ${it.sl===i?'sel':''} ${it.bad&&it.bad[0]===i?'bad':''}" data-act="ml" data-i="${i}"><span class="h">${esc(w.zh)}</span><span class="py">${esc(w.py)}</span></button>`).join('')}</div>
   <div class="col">${it.right.map((w,i)=>`<button class="opt ${it.m.has(w.zh)?'ok gone':''} ${it.sr===i?'sel':''} ${it.bad&&it.bad[1]===i?'bad':''}" data-act="mr" data-i="${i}"><span class="pic">${w.pic}</span></button>`).join('')}</div></div>`;
 case 'build':return tt('Bilde den Satz!','Build the sentence!','排一排')+`<div class="sent"><span class="pic">${it.s.pic}</span><span style="font-weight:700;font-size:18px">${M(it.s)}</span></div>

function answerHTML(it){
 if(it.w)return `<span class="han">${esc(it.w.zh)}</span> ${it.t==='tone'?'<b>'+esc(it.w.py)+'</b>':'<span class="py">'+esc(it.w.py)+'</span>'} · ${esc(M(it.w))} ${it.w.pic}`;
 if(it.s)return `<span class="han">${it.s.zh}</span> <span class="py">${it.s.py}</span> · ${M(it.s)}`;return''}
function renderLesson(){
 const it=item();prepare(it);
 const pct=Math.min(100,Math.round(L.done.size/L.total*100));const isLearn=it.t.startsWith('learn');
 const canCheck=isLearn||(it.t==='build'?L.ans.length>0:L.sel!==null);let foot='';
 if(L.phase==='fb'){const g=L.fb.ok;
  foot=`<div class="foot ${g?'good':'bad'}"><div class="fb"><span class="ic">${g?'🎉':'💡'}</span><div><h3>${g?L.fb.praise:'再试试！ '+D('Fast!','Almost!')}</h3>
   ${g?`<p>${answerHTML(it)}</p>`:`<p>${D('Richtige Antwort:','Correct answer:')}</p><p>${answerHTML(it)}</p><p class="hint">📕 ${D('Kommt ins Fehlerheft und gleich nochmal dran.','Goes into the mistake book and comes back in a moment.')}</p>`}</div></div>
   <button class="btn wide ${g?'':'red'}" data-act="next">${D('Weiter','Continue')}</button></div>`}
 else if(it.t!=='match')foot=`<div class="foot"><button class="btn wide" data-act="${isLearn?'next':'check'}" ${canCheck?'':'disabled'}>${isLearn?D('Weiter','Continue'):D('Prüfen','Check')}</button></div>`;
 return `<div class="lesson"><div class="lbar"><button class="x" data-act="quit" aria-label="${D('Schließen','Close')}">✕</button>
  ${L.mode==='review'?'<span class="chip">📕 错题本</span>':''}<div class="prog"><i style="width:${pct}%"></i></div><span class="hearts">❤️ ${L.hearts}</span></div>
  <div class="qbody">${qHTML(it)}</div>${foot}</div>`}
function addWrong(k){if(!k)return;const p=P();const o=p.wrong[k]||{k,n:0};o.n++;o.last=today();p.wrong[k]=o}
function grade(ok){
 const it=item(),p=P();L.asked++;p.stats.q++;
 if(ok){L.right++;p.stats.ok++;L.done.add(it.id);beep(true);if(L.mode==='review')delete p.wrong[itemKey(it)]}
 else{L.mist++;L.hearts--;beep(false);addWrong(itemKey(it));const c={t:it.t,w:it.w,s:it.s,id:it.id};L.q.push(c)}
 if(it.t==='tf')say(it.w.zh);else if(it.w)say(it.w.zh);else if(it.s)say(it.s.zh);
 L.phase='fb';L.fb={ok,praise:pick(PRAISE)};save();render()}
function next(){
 if(L.hearts<=0){R={fail:true};view='result';return render()}
 L.i++;L.sel=null;L.ans=[];L.phase='ans';
 if(L.i>=L.q.length)return finish();
 render();autoSay()}
function taskHook(p,res,ev){p.tasks.forEach(t=>{if(t.done)return;let hit=false;
 if(t.kind==='unit'&&ev.kind==='unit'&&ev.ok&&t.unit===ev.unit)hit=true;
 if(t.kind==='any'&&ev.kind==='unit'&&ev.ok){t.prog=(t.prog||0)+1;if(t.prog>=t.count)hit=true}
 if(t.kind==='review'&&ev.kind==='review')hit=true;
 if(hit){t.done=true;t.doneDay=today();res.tasks.push(t)}})}
function finish(){
 const p=P();const mins=Math.min(60,Math.max(1,Math.round((Date.now()-L.t0)/60000)));p.stats.min+=mins;
 const acc=L.asked?Math.round(L.right/L.asked*100):100;const res={mode:L.mode,acc,gain:[],tasks:[]};
 const gain=(l,n)=>{if(n>0)res.gain.push({l,n})};
 if(L.mode==='unit'){const u=U[L.ui],prev=p.units[u.id]||{};const perfect=L.mist===0;const ok=S.strict?perfect:true;
  const stars=perfect?3:L.mist<=2?2:1;const firstPass=ok&&!recPassed(prev);
  p.units[u.id]={stars:Math.max(prev.stars||0,ok?stars:0),passed:recPassed(prev)||ok,seen:true,best:Math.max(prev.best||0,acc),plays:(prev.plays||0)+1};
  res.stars=ok?stars:0;res.ok=ok;res.ui=L.ui;
  gain(D('Richtige Antworten','Correct answers'),L.right);
  if(firstPass)gain(D('Level geschafft','Level cleared'),10);else if(ok)gain(D('Level wiederholt','Level replayed'),3);
  if(perfect)gain(D('Fehlerfrei-Bonus','No-mistake bonus'),10);
  p.log.unshift({d:today(),u:u.zh,acc,m:mins});taskHook(p,res,{kind:'unit',unit:u.id,ok});
 }else{gain(D('Fehler korrigiert','Mistakes fixed'),L.right*2);p.log.unshift({d:today(),u:'错题本',acc,m:mins});taskHook(p,res,{kind:'review'})}
 p.log=p.log.slice(0,30);streakTick(p);
 const before=goalProg(p);res.gain.forEach(g=>earn(p,g.n));res.tasks.forEach(t=>earn(p,t.reward));
 res.goal=!!p.goal&&before<p.goal.target&&goalProg(p)>=p.goal.target;
 save();R=res;view='result';render();beep(true)}

  ${R.goal?`<div class="msg ok">🎁 ${D('Belohnung erreicht','Reward reached')}: ${esc(P().goal.text)}!</div>`:''}
  <div class="statrow"><div class="stat"><b>${R.acc}%</b><span>${D('Treffer','Accuracy')}</span></div><div class="stat"><b>🔥 ${P().streak}</b><span>${D('Tage','days')}</span></div><div class="stat"><b>🎋 ${P().bamboo}</b><span>${D('Bambus','Bamboo')}</span></div></div>
  <div style="display:flex;flex-direction:column;gap:12px;width:100%;max-width:320px;margin-top:8px"><button class="btn wide" data-act="tab" data-v="map">${D('Zur Karte','Back to map')}</button>

 if(kind==='memory'){const six=[];const seen=new Set();for(const w of ws){if(seen.has(w.pic))continue;seen.add(w.pic);six.push(w);if(six.length===6)break}
  G={kind,moves:0,open:[],got:new Set(),busy:false,cards:shuffle(six.flatMap(w=>[{w,f:'h'},{w,f:'p'}])),done:false};view='memory'}
 else{G={kind,rounds:ws.slice(0,8),i:0,score:0,bad:null,popped:null,done:false};balloonOpts();view='balloon'}
 render();if(kind==='balloon')say(G.rounds[0].zh)}

function copyFrom(id){const el=document.getElementById(id);if(!el)return;const txt=el.value||el.textContent;
 const sel=()=>{try{el.focus();el.select()}catch(e){}};
 try{navigator.clipboard.writeText(txt).then(()=>{const box=el.closest('.panel');const m=document.createElement('div');m.className='msg ok';m.textContent=D('Kopiert ✓','Copied ✓');if(box){box.appendChild(m);setTimeout(()=>m.remove(),1500)}},sel)}catch(e){sel()}}
function showCode(boxId,code,label){const box=document.getElementById(boxId);if(!box)return;
 box.innerHTML=`<label class="field" for="${boxId}-t">${label}<textarea id="${boxId}-t" readonly>${esc(code)}</textarea></label><button class="btn small sun" data-act="copy" data-target="${boxId}-t">📋 ${D('Kopieren','Copy')}</button>`}
app.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
 if(a==='noop')return;
 if(a==='closemod'){if(e.target.closest('.box')&&b.classList.contains('modal'))return;MOD=null;return render()}
 if(a==='say')return say(b.dataset.t);
 if(a==='copy')return copyFrom(b.dataset.target);
 if(a==='lang'){S.lang=S.lang==='de'?'en':'de';save();return render()}
 if(a==='pin'){S.pinyin=!S.pinyin;save();return render()}
 if(a==='av'){const inp=document.getElementById('pname');if(inp)draft.name=inp.value;draft.av=b.dataset.a;return render()}
 if(a==='choose'){S.current=b.dataset.n;save();view=view==='start'?'map':view;return render()}
 if(a==='switch'){view='start';return render()}
 if(a==='tab'){view=b.dataset.v;confirmX=null;G=null;return render()}
 if(a==='sub'){adultSub=b.dataset.s;confirmX=null;return render()}
 if(a==='tocode'){MOD=null;view='adult';adultSub='parent';return render()}
 if(a==='unit'){const i=+b.dataset.u;const ls=lockState(i);if(ls==='code'){MOD='code';return render()}if(!ls)startLesson(i);return}
 if(a==='review')return startReview();
 if(a==='again'){if(R&&R.mode==='review'||L&&L.mode==='review')return startReview();return startLesson(L.ui)}
 const p=P();
 /* arcade */
 if(a==='play')return startGame(b.dataset.g);
 if(a==='buystk'){const s=STICKERS[+b.dataset.i];if(p.bamboo>=STICKER_COST&&!p.owned.stickers.includes(s.zh)){p.bamboo-=STICKER_COST;p.owned.stickers.push(s.zh);save();say(s.zh);beep(true)}return render()}
 if(a==='hat'){const h=HATS.find(x=>x.e===b.dataset.h);if(!p.owned.hats.includes(h.e)){if(p.bamboo<h.c)return;p.bamboo-=h.c;p.owned.hats.push(h.e);p.hat=h.e;beep(true)}else p.hat=p.hat===h.e?'':h.e;save();return render()}
 if(a==='mc'&&G&&!G.busy&&!G.done){const i=+b.dataset.i,c=G.cards[i];if(G.open.includes(i)||G.got.has(c.w.zh))return;G.open.push(i);if(c.f==='h')say(c.w.zh);
  if(G.open.length===2){G.moves++;const [x,y]=G.open.map(k=>G.cards[k]);
   if(x.w.zh===y.w.zh){G.got.add(x.w.zh);G.open=[];beep(true);say(x.w.zh);if(G.got.size===6){G.done=true;if(G.moves<=10)earn(p,5);save()}}
   else{G.busy=true;setTimeout(()=>{G.open=[];G.busy=false;if(view==='memory')render()},800)}}
  return render()}
 if(a==='pop'&&G&&G.popped===null){const i=+b.dataset.i,w=G.rounds[G.i];
  if(G.opts[i]===w){G.popped=i;G.score++;earn(p,1);save();beep(true);say(w.zh);render();
   setTimeout(()=>{G.i++;G.popped=null;G.bad=null;if(G.i>=G.rounds.length){G.done=true}else balloonOpts();if(view==='balloon'){render();if(!G.done)say(G.rounds[G.i].zh)}},550)}
  else{G.bad=i;beep(false);render();setTimeout(()=>{if(G){G.bad=null;if(view==='balloon')render()}},350)}return}
 /* grown-ups */
 if(a==='deltask'){p.tasks.splice(+b.dataset.i,1);save();return render()}
 if(a==='goaldone'){p.goal=null;save();return render()}
 if(a==='lockadult'){adultOk=false;reqText='';return render()}
 if(a==='exportprog'){const data=JSON.parse(JSON.stringify(p));delete data.custom;return showCode('expbox',enc({k:'prog',name:S.current,data}),D('Diesen Code an die Lehrerin schicken:','Send this code to the teacher:'))}
 if(a==='exportcust')return showCode('custbox',enc({k:'cust',name:S.current,custom:p.custom}),D('Diesen Code den Eltern schicken:','Send this code to the parents:'));
 if(a==='cm'){p.custom.mascot=b.dataset.m;save();return render()}
 if(a==='ct'){p.custom.theme=b.dataset.k;save();return render()}
 if(a==='cf'){p.custom.focus=b.dataset.k;save();return render()}
 if(a==='delword'){p.custom.words.splice(+b.dataset.i,1);save();return render()}
 if(a==='resetchild'){if(confirmX!=='reset'){confirmX='reset';return render()}const keep={av:p.av,custom:p.custom};S.players[S.current]=norm(keep);confirmX=null;save();FLASH={ok:1,t:D('Zurückgesetzt.','Reset.')};return render()}
 if(a==='delchild'){if(confirmX!=='del'){confirmX='del';return render()}delete S.players[S.current];S.current=Object.keys(S.players)[0]||null;confirmX=null;save();view=S.current?'adult':'start';return render()}
 if(a==='tlogout'){S.teacher=false;S.unlockAll=false;save();return render()}
 if(view!=='lesson')return;
 /* lesson */
 const it=item();
 if(a==='quit'){view='map';return render()}
 if(a==='next')return next();
 if(L.phase==='fb')return;
 if(a==='opt'){L.sel=+b.dataset.i;const o=it.opts[L.sel];if(it.t==='gap')say(o.tile);return render()}
 if(a==='tile'){const k=+b.dataset.b;if(!L.ans.includes(k)){L.ans.push(k);say(it.bank[k])}return render()}
 if(a==='untile'){L.ans.splice(+b.dataset.k,1);return render()}
 if(a==='check'){if(it.t==='build')return grade(L.ans.map(k=>it.bank[k]).join('')===it.s.tiles.join(''));return grade(it.opts[L.sel].ok)}
 if(a==='ml'||a==='mr'){
  const i=+b.dataset.i;if(a==='ml'){it.sl=i;say(it.left[i].zh)}else it.sr=i;
  if(it.sl!==null&&it.sr!==null){
   if(it.left[it.sl].zh===it.right[it.sr].zh){it.m.add(it.left[it.sl].zh);beep(true);it.sl=it.sr=null;
    if(it.m.size===it.left.length){L.asked++;L.right++;p.stats.q++;p.stats.ok++;L.done.add(it.id);L.phase='fb';L.fb={ok:true,praise:pick(PRAISE)}}}
   else{it.bad=[it.sl,it.sr];addWrong('w:'+it.left[it.sl].zh);L.mist++;L.hearts--;beep(false);it.sl=it.sr=null;save();
    setTimeout(()=>{it.bad=null;if(L.hearts<=0){R={fail:true};view='result'}if(view==='lesson'||view==='result')render()},450)}}
  return render()}
});
app.addEventListener('change',e=>{
 if(e.target.id==='strict'){S.strict=e.target.checked;save()}
 if(e.target.id==='unlockall'){S.unlockAll=e.target.checked;save()}});
app.addEventListener('submit',e=>{
 const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();const k=f.dataset.form;const v=id=>(document.getElementById(id)||{}).value||'';const p=P();
 if(k==='newplayer'){const n=v('pname').trim();if(!n){document.getElementById('pname').focus();return}
  if(!S.players[n])S.players[n]=norm({av:draft.av});S.current=n;draft={name:'',av:'🐼'};save();view='map';return render()}
 if(k==='pinset'){const pin=v('pin1').trim();if(!/^\d{4}$/.test(pin)){FLASH={t:D('Bitte genau 4 Ziffern.','Please use exactly 4 digits.')};return render()}S.ppin=String(fnv('pin'+pin));adultOk=true;save();return render()}
 if(k==='pin'){if(String(fnv('pin'+v('pin2').trim()))===S.ppin){adultOk=true}else FLASH={t:D('PIN falsch.','Wrong PIN.')};return render()}
 if(k==='task'){const kind=v('tkind');p.tasks.push({kind,unit:v('tunit'),count:+v('tcount')||1,prog:0,reward:+v('trew')||10,done:false,created:today()});save();FLASH={ok:1,t:D('Aufgabe gegeben ✓','Task assigned ✓')};return render()}
 if(k==='goal'){const t=v('gtext').trim();if(!t)return;p.goal={text:t,target:+v('gtarget')||200,start:p.earned};save();return render()}
 if(k==='code'){const c=v('codein');if(validCode(c)){const n=normCode(c);S.license={code:'HQ-'+n.slice(2,6)+'-'+n.slice(6),date:today()};save();FLASH={ok:1,t:D('Vollversion freigeschaltet 🎉','Full version unlocked 🎉')}}else FLASH={t:D('Dieser Code stimmt nicht. Bitte Schreibweise prüfen (HQ-XXXX-XXXX).','That code is not valid. Please check the spelling (HQ-XXXX-XXXX).')};return render()}
 if(k==='book'){const s=childStats(p);const tw=Object.values(p.wrong).sort((a,b)=>b.n-a.n).slice(0,5).map(e=>{const it=findItem(e.k);const o=it&&(it.w||it.s);return o?o.zh+' ('+o.py+')':''}).filter(Boolean).join(', ');
  reqText=D(`Hallo ${CFG.teacher},\nich möchte gern eine Stunde anfragen: ${v('btype')}\n\nKind: ${S.current}\nHanzi Quest: ${s.done}/${UNITS.length} Level bestanden, ${s.acc} % richtig, ${s.min} Min gelernt\nHäufige Fehler: ${tw||'–'}\nWunschzeiten: ${v('btimes')||'–'}\nInteressen / Notiz: ${v('bnote')||'–'}\n\nVielen Dank!`,
   `Hello ${CFG.teacher},\nI would like to request a lesson: ${v('btype')}\n\nChild: ${S.current}\nHanzi Quest: ${s.done}/${UNITS.length} levels passed, ${s.acc}% correct, ${s.min} min learned\nFrequent mistakes: ${tw||'–'}\nPreferred times: ${v('btimes')||'–'}\nInterests / note: ${v('bnote')||'–'}\n\nThank you!`);return render()}
 if(k==='importcust'){try{const o=dec(v('custin'));if(o.k!=='cust')throw 0;p.custom=Object.assign(p.custom,o.custom);save();FLASH={ok:1,t:D('Anpassung übernommen 🎨','Personalisation applied 🎨')}}catch(err){FLASH={t:D('Code nicht erkannt.','Code not recognised.')}}return render()}
 if(k==='tcode'){if(fnv('t:'+normCode(v('tcin')))===CFG.tHash){S.teacher=true;save()}else FLASH={t:D('Lehrercode falsch.','Wrong teacher code.')};return render()}
 if(k==='importprog'){try{const o=dec(v('progin'));if(o.k!=='prog')throw 0;const name=String(o.name).slice(0,16);const q=norm(o.data);q.remote=true;if(S.players[name])q.custom=S.players[name].custom;S.players[name]=q;S.current=name;save();FLASH={ok:1,t:D(`${name} importiert ✓`,`${name} imported ✓`)}}catch(err){FLASH={t:D('Code nicht erkannt.','Code not recognised.')}}return render()}
 if(k==='notes'){p.custom.notes=v('cnotes');save();FLASH={ok:1,t:D('Gespeichert ✓','Saved ✓')};return render()}
 if(k==='word'){const zh=v('wzh').trim();if(!zh){FLASH={t:D('Bitte Hanzi eingeben.','Please enter the hanzi.')};return render()}
  if(p.custom.words.some(w=>w.zh===zh)||UNITS.some(u=>(u.words||[]).some(w=>w.zh===zh))){FLASH={t:D('Dieses Wort gibt es schon.','This word already exists.')};return render()}
  p.custom.words.push({zh,py:v('wpy').trim(),de:v('wde').trim()||zh,en:v('wen').trim()||v('wde').trim()||zh,pic:v('wpic').trim()||'⭐'});save();return render()}
});
render();
</script>
