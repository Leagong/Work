# Netlify-Site für sinobridge-ai.de
# In Netlify: Base directory = sinobridge-de, Publish directory = sinobridge-de (bzw. ".")
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
